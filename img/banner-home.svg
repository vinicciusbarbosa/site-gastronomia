<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" width="1100" height="300" role="img" aria-label="Banner do blog de gastronomia">
  <rect width="1100" height="300" fill="#c0392b"/>
  <rect width="1100" height="300" fill="url(#gb)" opacity="0.3"/>
  <defs>
    <radialGradient id="gb" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
  </defs>
  <g opacity="0.9">
    <circle cx="200" cy="150" r="70" fill="#fdf6ec"/>
    <circle cx="200" cy="150" r="45" fill="#e67e22"/>
    <circle cx="900" cy="150" r="70" fill="#fdf6ec"/>
    <circle cx="900" cy="150" r="45" fill="#27ae60"/>
  </g>
  <text x="550" y="140" font-family="Georgia, serif" font-size="48" fill="#ffffff" text-anchor="middle" font-weight="bold">Sabor &amp; Arte</text>
  <text x="550" y="185" font-family="Segoe UI, sans-serif" font-size="22" fill="#fdf6ec" text-anchor="middle" font-style="italic">a gastronomia em cada detalhe</text>
</svg>
