<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Ilustração de prato com talheres">
  <rect width="600" height="400" fill="#e67e22"/>
  <rect width="600" height="400" fill="url(#g)" opacity="0.35"/>
  <defs>
    <radialGradient id="g" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
  </defs>
  <!-- prato -->
  <circle cx="300" cy="200" r="120" fill="#fdf6ec"/>
  <circle cx="300" cy="200" r="120" fill="none" stroke="#c0392b" stroke-width="6"/>
  <circle cx="300" cy="200" r="80" fill="none" stroke="#e8dccb" stroke-width="4"/>
  <!-- comida -->
  <circle cx="280" cy="190" r="28" fill="#c0392b"/>
  <circle cx="330" cy="215" r="22" fill="#27ae60"/>
  <circle cx="300" cy="230" r="18" fill="#f1c40f"/>
  <!-- garfo -->
  <g fill="#fff">
    <rect x="120" y="120" width="8" height="160" rx="4"/>
    <rect x="108" y="110" width="6" height="40" rx="3"/>
    <rect x="122" y="110" width="6" height="40" rx="3"/>
    <rect x="136" y="110" width="6" height="40" rx="3"/>
  </g>
  <!-- faca -->
  <g fill="#fff">
    <rect x="475" y="120" width="8" height="160" rx="4"/>
    <path d="M472 110 q14 0 14 40 l-14 0 z"/>
  </g>
  <text x="300" y="360" font-family="Georgia, serif" font-size="34" fill="#ffffff" text-anchor="middle" font-weight="bold">Receitas</text>
</svg>
